    <!-- Google Fonts: Plus Jakarta Sans, Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Native 0ms PS5 Obsidian + Underwater Sunbeams + Silk Waves Splash Screen -->
    <style>
      html, body {
        margin: 0;
        background-color: #050404;
      }
      #avl-pwa-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background-color: #030304;
        background-image:
          radial-gradient(circle at 10% 4%, rgba(242, 206, 158, 0.11), rgba(176, 134, 86, 0.04) 32%, transparent 60%),
          linear-gradient(145deg, #0a0807 0%, #050505 38%, #030304 72%, #010102 100%);
        font-family: 'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif;
        color: #f8fafc;
        transition: opacity 0.38s cubic-bezier(0.22, 1, 0.36, 1),
                    transform 0.38s cubic-bezier(0.22, 1, 0.36, 1);
        user-select: none;
        -webkit-user-select: none;
      }
      #avl-pwa-splash.avl-splash-hide {
        opacity: 0;
        transform: scale(1.03);
        pointer-events: none;
      }
      .ps5-boot-rays {
        position: absolute;
        top: -15%;
        left: -10%;
        width: 75vw;
        height: 85vh;
        pointer-events: none;
        background:
          linear-gradient(128deg, rgba(255, 232, 192, 0.055) 0%, rgba(214, 168, 114, 0.02) 35%, transparent 68%);
        filter: blur(28px);
        transform-origin: top left;
        animation: ps5RaySway 6.5s ease-in-out infinite alternate;
      }
      .ps5-boot-waves {
        position: absolute;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
      }
      .ps5-boot-wave {
        position: absolute;
        left: -20%;
        width: 140%;
        height: 120px;
        border-radius: 50%;
        border-top: 1px solid rgba(248, 236, 218, 0.12);
        border-bottom: 1px solid rgba(235, 208, 170, 0.08);
        background: linear-gradient(180deg, rgba(245, 230, 205, 0.028), rgba(245, 230, 205, 0.005), rgba(245, 230, 205, 0.022));
        filter: blur(2px);
        animation: ps5WaveDrift 7s ease-in-out infinite alternate;
      }
      .ps5-boot-wave-1 {
        top: 52%;
        transform: rotate(-3deg);
      }
      .ps5-boot-wave-2 {
        top: 58%;
        transform: rotate(2.5deg);
        animation-duration: 9s;
        animation-direction: alternate-reverse;
      }
      .avl-splash-avatar-wrap {
        position: relative;
        width: clamp(176px, 28vw, 256px);
        height: clamp(176px, 28vw, 256px);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 34px;
        z-index: 2;
      }
      .avl-splash-ring {
        position: absolute;
        inset: -24px;
        border-radius: 9999px;
        border: 1px solid rgba(254, 243, 199, 0.28);
        animation: avlRingPulse 2.8s ease-in-out infinite;
      }
      .avl-splash-ring-2 {
        position: absolute;
        inset: -48px;
        border-radius: 9999px;
        border: 1px solid rgba(245, 208, 148, 0.18);
        animation: avlRingPulse 3.4s ease-in-out 0.45s infinite;
      }
      .avl-splash-spin {
        position: absolute;
        inset: -8px;
        border-radius: 9999px;
        padding: 3px;
        background: conic-gradient(from 0deg, rgba(255,250,240,0.94), rgba(245,208,148,0.85), rgba(186,138,84,0.45), rgba(255,255,255,0.06), rgba(245,222,182,0.55), rgba(255,250,240,0.94));
        animation: ps5Spin 7s linear infinite;
      }
      .avl-splash-spin-inner {
        width: 100%;
        height: 100%;
        border-radius: 9999px;
        background: #090706;
      }
      .avl-splash-circle {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: 9999px;
        overflow: hidden;
        background: linear-gradient(145deg, #1b1612, #070606);
        box-shadow: 0 28px 85px -10px rgba(218, 172, 108, 0.46),
                    0 0 0 2px rgba(254, 243, 199, 0.28);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .avl-splash-photo {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 9999px;
      }
      .avl-splash-icon {
        width: 56%;
        height: 56%;
        object-fit: contain;
      }
      .avl-splash-initials {
        font-size: clamp(48px, 7vw, 72px);
        font-weight: 800;
        color: #fffbeb;
        letter-spacing: -0.02em;
      }
      .avl-splash-eyebrow {
        position: relative;
        z-index: 2;
        margin: 0 0 10px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.34em;
        text-transform: uppercase;
        color: rgba(254, 243, 199, 0.72);
      }
      .avl-splash-title {
        position: relative;
        z-index: 2;
        font-size: clamp(28px, 4.5vw, 48px);
        font-weight: 800;
        letter-spacing: -0.02em;
        line-height: 1.15;
        margin: 0;
        padding: 0 20px;
        text-align: center;
        color: #ffffff;
      }
      .avl-splash-greeting {
        font-weight: 600;
        color: rgba(254, 243, 199, 0.9);
      }
      .avl-splash-bar-track {
        position: relative;
        z-index: 2;
        margin-top: 24px;
        width: 192px;
        height: 2px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.14);
        overflow: hidden;
      }
      .avl-splash-bar-fill {
        position: absolute;
        inset: 0;
        width: 48%;
        border-radius: 999px;
        background: linear-gradient(90deg, transparent, rgba(255, 244, 224, 0.9) 35%, rgba(245, 201, 132, 0.95) 65%, transparent);
        animation: avlBarSlide 1.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .avl-splash-status {
        position: relative;
        z-index: 2;
        margin-top: 12px;
        font-size: 12px;
        font-weight: 400;
        color: rgba(214, 211, 209, 0.72);
      }
      @keyframes avlRingPulse {
        0%, 100% { transform: scale(0.98); opacity: 0.42; }
        50% { transform: scale(1.1); opacity: 0.12; }
      }
      @keyframes ps5Spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes ps5RaySway {
        0% { transform: rotate(-3deg) scale(0.98); opacity: 0.78; }
        100% { transform: rotate(4deg) scale(1.06); opacity: 1; }
      }
      @keyframes ps5WaveDrift {
        0% { transform: translateX(-4%) translateY(-8px) rotate(-2.5deg); }
        100% { transform: translateX(4%) translateY(8px) rotate(2.5deg); }
      }
      @keyframes avlBarSlide {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(250%); }
      }
    </style>
  </head>

  <body>
    <!-- Splash Screen Nativa 0ms estilo PlayStation 5 -->
    <div id="avl-pwa-splash" role="status" aria-label="Carregando AVL Telecom Command Center">
      <div class="ps5-boot-rays" aria-hidden="true"></div>
      <div class="ps5-boot-waves" aria-hidden="true">
        <div class="ps5-boot-wave ps5-boot-wave-1"></div>
      </div>
      <div class="avl-splash-avatar-wrap">
        <div class="avl-splash-ring"></div>
        <div class="avl-splash-ring-2"></div>
        <div class="avl-splash-spin"><div class="avl-splash-spin-inner"></div></div>
        <div class="avl-splash-circle" id="avl-splash-circle">
          <img src="/pwa-192x192.png" alt="AVL Telecom" class="avl-splash-icon" width="76" height="76" />
        </div>
      </div>
      <p class="avl-splash-eyebrow" id="avl-splash-eyebrow">AVL TELECOM • NOC</p>
      <h1 class="avl-splash-title" id="avl-splash-title">AVL Telecom</h1>
      <div class="avl-splash-bar-track">
        <div class="avl-splash-bar-fill"></div>
      </div>
      <p class="avl-splash-status">Inicializando painel operacional...</p>
    </div>

    <script>
      window.__AVL_SPLASH_START__ = performance.now();
      // Hidrata imediatamente a foto circular e nome do último usuário logado (0ms)
      try {
        var cachedRaw = localStorage.getItem('avl_last_user_splash_v1');
        if (cachedRaw) {
          var cached = JSON.parse(cachedRaw);
          var circle = document.getElementById('avl-splash-circle');
          var titleEl = document.getElementById('avl-splash-title');
          var eyebrowEl = document.getElementById('avl-splash-eyebrow');
          if (cached && (cached.name || cached.email)) {
            if (eyebrowEl) eyebrowEl.textContent = 'AVL TELECOM • NOC';
            if (titleEl) {
              titleEl.textContent = '';
              var greetSpan = document.createElement('span');
              greetSpan.className = 'avl-splash-greeting';
              greetSpan.textContent = 'Bem-vindo de volta, ';
              var nameSpan = document.createElement('span');
              nameSpan.textContent = cached.name || cached.email;
              titleEl.appendChild(greetSpan);
              titleEl.appendChild(nameSpan);
            }
            if (circle) {
              var initials = String(cached.name || cached.email || 'AV').trim().substring(0, 2).toUpperCase();
              var renderInitials = function () {
                circle.textContent = '';
                var span = document.createElement('span');
                span.className = 'avl-splash-initials';
                span.textContent = initials;
                circle.appendChild(span);
              };
              if (cached.photoUrl && /^https?:\/\//i.test(cached.photoUrl)) {
                circle.textContent = '';
                var img = document.createElement('img');
                img.src = cached.photoUrl;
                img.alt = cached.name || 'Usuário';
                img.className = 'avl-splash-photo';
                img.onerror = renderInitials;
                circle.appendChild(img);
              } else {
                renderInitials();
              }
            }
          }
        }
      } catch (e) {}

      // Fallback de segurança caso algum script falhe
      window.setTimeout(function () {
        var el = document.getElementById('avl-pwa-splash');
        if (el) {
          el.classList.add('avl-splash-hide');
          window.setTimeout(function () { el.remove(); }, 400);
        }
      }, 6000);
    </script>

    <div id="root"></div>
    <!-- IMPORTANT: DO NOT REMOVE THIS SCRIPT TAG OR THIS VERY COMMENT! -->
    <script src="https://cdn.gpteng.co/gptengineer.js" type="module"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
