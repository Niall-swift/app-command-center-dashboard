<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>AVL Telecom — Command Center NOC</title>
    <meta name="description" content="Painel de Operações NOC, ISPFY e Atendimento WhatsApp 360° AVL Telecom" />
    <meta name="author" content="AVL Telecom" />

    <!-- PWA & Native App Meta Tags (Windows, macOS, Android, iOS) -->
    <meta name="theme-color" content="#0b1222" />
    <meta name="application-name" content="AVL NOC" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AVL NOC" />
    <meta name="msapplication-TileColor" content="#0b1222" />

    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/mask-icon.svg" color="#2563EB" />

    <meta property="og:title" content="AVL Telecom — Command Center NOC" />
    <meta property="og:description" content="Painel de Operações NOC, ISPFY e Atendimento AVL Telecom" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/pwa-512x512.png" />

    <!-- Google Fonts: Plus Jakarta Sans, Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Native 0ms PWA Splash Screen (carrega antes do React, sem flash branco) -->
    <style>
      html, body {
        margin: 0;
        background-color: #0b1222;
      }
      #avl-pwa-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #0b1222;
        background-image:
          radial-gradient(circle at 22% 20%, rgba(37, 99, 235, 0.28), transparent 46%),
          radial-gradient(circle at 80% 78%, rgba(124, 58, 237, 0.24), transparent 46%),
          linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
        background-size: 100% 100%, 100% 100%, 36px 36px, 36px 36px;
        font-family: 'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif;
        color: #f8fafc;
        transition: opacity 0.36s cubic-bezier(0.22, 1, 0.36, 1),
                    transform 0.36s cubic-bezier(0.22, 1, 0.36, 1);
        user-select: none;
        -webkit-user-select: none;
      }
      #avl-pwa-splash.avl-splash-hide {
        opacity: 0;
        transform: scale(1.03);
        pointer-events: none;
      }
      .avl-splash-logo-wrap {
        position: relative;
        width: 104px;
        height: 104px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 24px;
      }
      .avl-splash-ring {
        position: absolute;
        inset: -12px;
        border-radius: 34px;
        border: 1.5px solid rgba(96, 165, 250, 0.32);
        animation: avlRingPulse 2.2s ease-in-out infinite;
      }
      .avl-splash-ring-2 {
        position: absolute;
        inset: -24px;
        border-radius: 42px;
        border: 1px solid rgba(124, 58, 237, 0.18);
        animation: avlRingPulse 2.2s ease-in-out 0.45s infinite;
      }
      .avl-splash-icon {
        width: 96px;
        height: 96px;
        border-radius: 24px;
        box-shadow: 0 20px 50px -12px rgba(37, 99, 235, 0.65),
                    0 0 0 1px rgba(255, 255, 255, 0.14);
        animation: avlIconFloat 2.6s ease-in-out infinite;
      }
      .avl-splash-title {
        font-size: 24px;
        font-weight: 800;
        letter-spacing: -0.02em;
        margin: 0;
        color: #ffffff;
      }
      .avl-splash-sub {
        margin: 8px 0 26px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #93c5fd;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 4px 12px;
        border-radius: 999px;
        background: rgba(37, 99, 235, 0.14);
        border: 1px solid rgba(96, 165, 250, 0.24);
      }
      .avl-splash-dot {
        width: 7px;
        height: 7px;
        border-radius: 999px;
        background: #34d399;
        box-shadow: 0 0 10px #34d399;
      }
      .avl-splash-bar-track {
        width: 210px;
        height: 4px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.1);
        overflow: hidden;
        position: relative;
      }
      .avl-splash-bar-fill {
        position: absolute;
        inset: 0;
        width: 45%;
        border-radius: 999px;
        background: linear-gradient(90deg, #3b82f6, #8b5cf6, #34d399);
        animation: avlBarSlide 1.25s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .avl-splash-status {
        margin-top: 14px;
        font-size: 12px;
        font-weight: 500;
        color: #94a3b8;
      }
      @keyframes avlRingPulse {
        0%, 100% { transform: scale(0.97); opacity: 0.45; }
        50% { transform: scale(1.05); opacity: 1; }
      }
      @keyframes avlIconFloat {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
      }
      @keyframes avlBarSlide {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(250%); }
      }
    </style>
  </head>

  <body>
    <!-- Splash Screen Nativa PWA -->
    <div id="avl-pwa-splash" role="status" aria-label="Carregando AVL Telecom Command Center">
      <div class="avl-splash-logo-wrap">
        <div class="avl-splash-ring"></div>
        <div class="avl-splash-ring-2"></div>
        <img src="/pwa-192x192.png" alt="AVL Telecom" class="avl-splash-icon" width="96" height="96" />
      </div>
      <h1 class="avl-splash-title">AVL Telecom</h1>
      <div class="avl-splash-sub">
        <span class="avl-splash-dot"></span>
        Command Center NOC
      </div>
      <div class="avl-splash-bar-track">
        <div class="avl-splash-bar-fill"></div>
      </div>
      <p class="avl-splash-status">Inicializando painel operacional...</p>
    </div>

    <script>
      window.__AVL_SPLASH_START__ = performance.now();
      // Fallback de segurança caso algum script falhe
      window.setTimeout(function () {
        var el = document.getElementById('avl-pwa-splash');
        if (el) {
          el.classList.add('avl-splash-hide');
          window.setTimeout(function () { el.remove(); }, 400);
        }
      }, 6000);
    </script>

    <div id="root"></div>
    <!-- IMPORTANT: DO NOT REMOVE THIS SCRIPT TAG OR THIS VERY COMMENT! -->
    <script src="https://cdn.gpteng.co/gptengineer.js" type="module"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
